<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أثر ولمسة | للطباعة والتصميم والهدايا</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#090908;width:100%;height:100%;font-family:Arial,sans-serif}.athar-banner{width:100%;background:#090908;line-height:0}.athar-banner img{display:block;width:100%;height:auto;max-height:720px;object-fit:cover;object-position:center}.store{display:block;width:100%;height:calc(100vh - min(50vw,720px));min-height:900px;border:0;background:#f7f3e9}@media(max-width:700px){.athar-banner img{min-height:240px;object-fit:cover;object-position:center}.store{height:1200px;min-height:1200px}}
</style>
</head>
<body>
<div class="athar-banner"><img src="athar-header.jpg" alt="أثر ولمسة - كل منتج يحمل أثراً ويترك لمسة"></div>
<iframe id="storeFrame" class="store" src="index-single-file.html" title="متجر أثر ولمسة"></iframe>
<script>
const frame=document.getElementById('storeFrame');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument||frame.contentWindow.document;
    const style=doc.createElement('style');
    style.textContent=`
      .product-img,.pic{background:#f6f6f3!important;border-radius:16px!important;overflow:hidden!important;padding:14px!important;box-shadow:inset 0 0 0 1px #ebe7de!important}
      .product-img img,.pic img{width:100%!important;height:100%!important;object-fit:contain!important;object-position:center!important;filter:contrast(1.04) saturate(1.04) brightness(1.02)!important;image-rendering:auto!important;transition:transform .25s ease,filter .25s ease!important}
      .product-card:hover .product-img img,.card:hover .pic img{transform:scale(1.035)!important;filter:contrast(1.06) saturate(1.06) brightness(1.03)!important}
      .product-card,.card{border-radius:18px!important;box-shadow:0 10px 28px rgba(35,25,10,.08)!important;overflow:hidden!important}
      .product-card:hover,.card:hover{box-shadow:0 18px 42px rgba(35,25,10,.15)!important}
      .hero-img img{object-fit:contain!important;filter:contrast(1.03) saturate(1.03)!important}
      @media(min-width:701px){.product-img,.pic{height:330px!important}}
      @media(max-width:700px){.product-img,.pic{height:220px!important;padding:9px!important}}
    `;
    doc.head.appendChild(style);
    const imgs=doc.querySelectorAll('.product-img img,.pic img');
    imgs.forEach(img=>{img.loading='lazy';img.decoding='async';});
  }catch(e){console.warn('Product image enhancement skipped',e)}
});
</script>
</body>
</html>
