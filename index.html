<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أثر ولمسة | للطباعة والتصميم والهدايا</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#090908;width:100%;height:100%;font-family:Arial,sans-serif}.athar-banner{width:100%;background:#090908;line-height:0}.athar-banner img{display:block;width:100%;height:auto;max-height:720px;object-fit:cover;object-position:center}.store{display:block;width:100%;height:calc(100vh - min(50vw,720px));min-height:1100px;border:0;background:#f7f3e9}@media(max-width:700px){.athar-banner img{min-height:240px;object-fit:cover;object-position:center}.store{height:1600px;min-height:1600px}}
</style>
</head>
<body>
<div class="athar-banner"><img src="athar-header.jpg" alt="أثر ولمسة - كل منتج يحمل أثراً ويترك لمسة"></div>
<iframe id="storeFrame" class="store" src="index-single-file.html?v=20260913-10" title="متجر أثر ولمسة"></iframe>
<script>
const frame=document.getElementById('storeFrame');
const WA='966551902949';
const products={
 shirts:[
  {name:'مستمر',cat:'عبارات تحفيزية',price:'89 ر.س',img:'shirts/shirt-1.jpg'},
  {name:'نسخة أفضل',cat:'عبارات تحفيزية',price:'89 ر.س',img:'shirts/shirt-2.jpg'},
  {name:'روح السعودية',cat:'تصاميم سعودية',price:'89 ر.س',img:'shirts/shirt-3.jpg'},
  {name:'قوة وإنجاز',cat:'عبارات تحفيزية',price:'89 ر.س',img:'shirts/shirt-4.jpg'},
  {name:'الطريق يستحق',cat:'عبارات تحفيزية',price:'89 ر.س',img:'shirts/shirt-5.jpg'}
 ],
 mugs:[
  {name:'كل يوم فرصة',cat:'أكواب تحفيزية',price:'السعر عند الطلب',img:'mugs/mug-1.jpg'},
  {name:'عقل أهدأ',cat:'أكواب تحفيزية',price:'السعر عند الطلب',img:'mugs/mug-2.jpg'}
 ],
 cases:[
  {name:'خطوة أقرب',cat:'كفرات جوال',price:'السعر عند الطلب',img:'other-products/case-1.jpg'},
  {name:'سعودي وأفتخر',cat:'كفرات جوال',price:'السعر عند الطلب',img:'other-products/case-2.jpg'},
  {name:'الأشياء الجيدة',cat:'كفرات جوال',price:'السعر عند الطلب',img:'other-products/case-3.jpg'}
 ]
};
function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
function waLink(name){return `https://wa.me/${WA}?text=${encodeURIComponent('مرحباً أثر ولمسة، أرغب في طلب تصميم: '+name)}`}
function card(p){return `<article class="product-card athar-real-card"><div class="athar-real-img"><img src="${p.img}" alt="${esc(p.name)}"></div><h3>${esc(p.name)}</h3><p>${esc(p.cat)} • تصميم معتمد</p><div class="price">${esc(p.price)}</div><a class="athar-order" href="${waLink(p.name)}" target="_blank" rel="noopener">اطلب عبر واتساب 💬</a></article>`}
function inject(doc){
 if(doc.getElementById('athar-real-products'))return;
 const marker=doc.createElement('i');marker.id='athar-real-products';marker.hidden=true;doc.body.appendChild(marker);
 const sg=doc.querySelector('#products .grid')||doc.querySelector('#products');
 const mg=doc.querySelector('#mugs .grid')||doc.querySelector('#mugs');
 const og=doc.querySelector('#other-products .grid')||doc.querySelector('#other-products');
 if(sg)sg.insertAdjacentHTML('afterbegin',products.shirts.map(card).join(''));
 if(mg)mg.insertAdjacentHTML('afterbegin',products.mugs.map(card).join(''));
 if(og)og.insertAdjacentHTML('afterbegin',products.cases.map(card).join(''));
}
function apply(){
 try{
  const doc=frame.contentDocument||frame.contentWindow.document;if(!doc||!doc.head||!doc.body)return;
  let st=doc.getElementById('athar-real-style');if(!st){st=doc.createElement('style');st.id='athar-real-style';doc.head.appendChild(st)}
  st.textContent=`
  .athar-real-card{background:#fff!important;border:1px solid #e8dfd2!important;border-radius:18px!important;box-shadow:0 12px 32px rgba(0,0,0,.08)!important;overflow:hidden!important}
  .athar-real-img{height:330px!important;background:#f3f0e8!important;padding:0!important;display:flex!important;align-items:center!important;justify-content:center!important;overflow:hidden!important}
  .athar-real-img img{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important;transform:none!important;filter:none!important;margin:0!important}
  .athar-real-card:hover .athar-real-img img{transform:scale(1.025)!important}
  .athar-real-card h3{font-weight:900!important;margin-top:14px!important}.athar-real-card p{color:#8f846f!important}.athar-real-card .price{font-weight:900!important;color:#8b6811!important}
  .athar-order{display:block!important;width:100%!important;background:#151311!important;color:#fff!important;text-align:center!important;padding:13px 10px!important;border-radius:8px!important;font-weight:900!important;text-decoration:none!important;margin-top:10px!important}.athar-order:hover{background:#d6a91e!important;color:#111!important}
  .athar-contact-strip{position:sticky!important;top:0!important;z-index:9999!important;background:#0d0c0b!important;color:#fff!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:22px!important;flex-wrap:wrap!important;padding:10px 14px!important;border-bottom:1px solid #3d321d!important}.athar-contact-strip a{color:#fff!important;text-decoration:none!important;font-weight:800!important}.athar-contact-strip a:hover{color:#d6a91e!important}
  .athar-contact-floating{position:fixed!important;right:18px!important;bottom:18px!important;z-index:99999!important;display:flex!important;flex-direction:column!important;gap:10px!important}.athar-contact-floating a{display:flex!important;align-items:center!important;justify-content:center!important;padding:12px 16px!important;border-radius:28px!important;text-decoration:none!important;font-weight:900!important;box-shadow:0 8px 24px rgba(0,0,0,.22)!important}.athar-wa{background:#25D366!important;color:#fff!important}.athar-mail{background:#d6a91e!important;color:#111!important}
  @media(max-width:700px){.athar-real-img{height:270px!important}.athar-contact-strip{gap:10px!important;font-size:11px!important}.athar-contact-floating{right:10px!important;bottom:10px!important}.athar-contact-floating a{padding:10px 12px!important;font-size:12px!important}}
  `;
  inject(doc);
  let strip=doc.querySelector('.athar-contact-strip');if(!strip){strip=doc.createElement('div');strip.className='athar-contact-strip';strip.innerHTML='<a href="https://wa.me/966551902949" target="_blank">📱 واتساب: 055 190 2949</a><a href="mailto:atharlmssa@gmail.com">✉️ atharlmssa@gmail.com</a>';doc.body.insertBefore(strip,doc.body.firstChild)}
  let fl=doc.querySelector('.athar-contact-floating');if(!fl){fl=doc.createElement('div');fl.className='athar-contact-floating';fl.innerHTML='<a class="athar-wa" href="https://wa.me/966551902949" target="_blank">💬 واتساب</a><a class="athar-mail" href="mailto:atharlmssa@gmail.com">✉️ البريد الإلكتروني</a>';doc.body.appendChild(fl)}
 }catch(e){console.warn(e)}
}
frame.addEventListener('load',()=>{apply();setTimeout(apply,350);setTimeout(apply,1000)});
</script>
</body>
</html>
