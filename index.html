   else if(p.icon==='lion') art+=`<g text-anchor="middle"><circle cx="500" cy="420" r="120" fill="#242424"/><path d="M500 310 C445 335 430 395 445 465 C472 515 528 515 555 465 C570 395 555 335 500 310 Z" fill="#d8d8d8"/><text x="345" y="390" font-family="Arial" font-weight="900" font-size="40" fill="${txt}">قوة</text><text x="345" y="438" font-family="Arial" font-weight="900" font-size="40" fill="${GOLD}">صبر</text><text x="345" y="486" font-family="Arial" font-weight="900" font-size="40" fill="${txt}">تركيز</text><text x="450" y="625" font-family="Arial" font-weight="900" font-size="58" fill="${txt}">${esc(p.line1)}</text></g>`;
   else art+=`<g text-anchor="middle"><text x="450" y="455" font-family="Arial" font-weight="900" font-size="70" fill="${txt}">${esc(p.line1)}</text><text x="450" y="525" font-family="Arial" font-weight="700" font-size="38" fill="${GOLD}">${esc(p.line2)}</text></g>`;

 }
 if(p.type==='case'){
   const fill=p.dark?BLACK:(p.bg||'#d8d0c0'),txt=p.dark?'#fff':'#111';

 return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(base+art+'</svg>');

const shirts=[

function card(p){return `<article class="product-card athar-approved-card"><div class="product-img athar-approved-img"><img src="${svgProduct(p)}" alt="${esc(p.name)}"></div><h3>${esc(p.name)}</h3><p>${esc(p.cat)} • تصميم معتمد</p><div class="price">${esc(p.price)}</div><a class="athar-order" href="${waLink(p.name)}" target="_blank" rel="noopener">اطلب عبر واتساب 💬</a></article>`}

nt-weight:800!important}.athar-contact-strip a:hover{color:#d6a91e!important}.athar-contact-floating{position:fixed!important;right:18px!important;bottom:18px!important;z-index:99999!important;display:flex!important;flex-direction:column!important;gap:10px!important}.athar-contact-floating a{display:flex!important;align-items:center!important;justify-content:center!important;padding:12px 16px!important;border-radius:28px!important;text-decoration:none!important;font-weight:900!important;box-shadow:0 8px 24px rgba(0,0,0,.22)!important}.athar-wa{background:#25D366!important;color:#fff!important}.athar-mail{background:#d6a91e!important;color:#111!important}@media(max-width:700px){.athar-approved-card .athar-approved-img{height:250px!important}.athar-contact-strip{gap:10px!important;font-size:11px!important}.athar-contact-floating{right:10px!important;bottom:10px!important}.athar-contact-floating a{padding:10px 12px!important;font-size:12px!important}}`;inject(doc);let strip=doc.querySelector('.athar-contact-strip');if(!strip){strip=doc.createElement('div');strip.className='athar-contact-strip';strip.innerHTML='<a href="https://wa.me/966551902949" target="_blank">📱 واتساب: 055 190 2949</a><a href="mailto:atharlmssa@gmail.com">✉️ atharlmssa@gmail.com</a>';doc.body.insertBefore(strip,doc.body.firstChild)}let fl=doc.querySelector('.athar-contact-floating');if(!fl){fl=doc.createElement('div');fl.className='athar-contact-floating';fl.innerHTML='<a class="athar-wa" href="https://wa.me/966551902949" target="_blank">💬 واتساب</a><a class="athar-mail" href="mailto:atharlmssa@gmail.com">✉️ البريد الإلكتروني</a>';doc.body.appendChild(fl)}}catch(e){console.warn(e)}}
