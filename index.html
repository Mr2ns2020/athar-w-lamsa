<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أثر ولمسة | للطباعة والتصميم والهدايا</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#090908;width:100%;height:100%;font-family:Arial,sans-serif}.athar-banner{width:100%;background:#090908;line-height:0}.athar-banner img{display:block;width:100%;height:auto;max-height:720px;object-fit:cover;object-position:center}.store{display:block;width:100%;height:calc(100vh - min(50vw,720px));min-height:900px;border:0;background:#f7f3e9}@media(max-width:700px){.athar-banner img{min-height:240px;object-fit:cover;object-position:center}.store{height:1200px;min-height:1200px}}
</style>
</head>
<body>
<div class="athar-banner"><img src="athar-header.jpg" alt="أثر ولمسة - كل منتج يحمل أثراً ويترك لمسة"></div>
<iframe id="storeFrame" class="store" src="index-single-file.html?v=20260913-5" title="متجر أثر ولمسة"></iframe>
<script>
const frame=document.getElementById('storeFrame');
function applyStoreFixes(){
  try{
    const doc=frame.contentDocument||frame.contentWindow.document;
    if(!doc||!doc.head||!doc.body)return;

    let style=doc.getElementById('athar-store-fix');
    if(!style){style=doc.createElement('style');style.id='athar-store-fix';doc.head.appendChild(style)}
    style.textContent=`
      .product-img,.pic{display:flex!important;align-items:center!important;justify-content:center!important;overflow:hidden!important;background:#f4f2ec!important;padding:10px!important}
      .product-img img,.pic img{display:block!important;width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;object-fit:cover!important;object-position:center center!important;margin:0!important;filter:contrast(1.04) saturate(1.04) brightness(1.02)!important;transform:none!important;border-radius:8px!important}
      .product-card:hover .product-img img,.card:hover .pic img{transform:scale(1.01)!important}
      .athar-contact-strip{position:sticky!important;top:0!important;z-index:9999!important;background:#0d0c0b!important;color:#fff!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:22px!important;flex-wrap:wrap!important;padding:10px 14px!important;border-bottom:1px solid #3d321d!important;font-family:Cairo,Arial,sans-serif!important}
      .athar-contact-strip a{color:#fff!important;text-decoration:none!important;font-weight:800!important;font-size:14px!important}
      .athar-contact-strip a:hover{color:#d6a91e!important}
      .athar-contact-floating{position:fixed!important;right:18px!important;bottom:18px!important;z-index:99999!important;display:flex!important;flex-direction:column!important;gap:10px!important}
      .athar-contact-floating a{display:flex!important;align-items:center!important;justify-content:center!important;min-width:165px!important;padding:12px 16px!important;border-radius:28px!important;text-decoration:none!important;font-weight:900!important;box-shadow:0 8px 24px rgba(0,0,0,.22)!important}
      .athar-wa{background:#25D366!important;color:#fff!important}.athar-mail{background:#d6a91e!important;color:#111!important}
      .athar-contact-box{display:flex!important;gap:12px!important;flex-wrap:wrap!important;margin-top:18px!important}
      .athar-contact-box a{display:inline-block!important;padding:12px 18px!important;border-radius:8px!important;font-weight:800!important;text-decoration:none!important}
      @media(max-width:700px){.product-img,.pic{padding:7px!important}.athar-contact-strip{gap:10px!important;padding:8px!important}.athar-contact-strip a{font-size:11px!important}.athar-contact-floating{right:10px!important;bottom:10px!important}.athar-contact-floating a{min-width:0!important;padding:11px 14px!important;font-size:12px!important}}
    `;

    let strip=doc.querySelector('.athar-contact-strip');
    if(!strip){
      strip=doc.createElement('div');
      strip.className='athar-contact-strip';
      strip.innerHTML='<a href="https://wa.me/966551902949" target="_blank" rel="noopener">📱 واتساب: 055 190 2949</a><a href="mailto:atharlmssa@gmail.com">✉️ atharlmssa@gmail.com</a>';
      doc.body.insertBefore(strip,doc.body.firstChild);
    }

    let floating=doc.querySelector('.athar-contact-floating');
    if(!floating){
      floating=doc.createElement('div');
      floating.className='athar-contact-floating';
      floating.innerHTML='<a class="athar-wa" href="https://wa.me/966551902949" target="_blank" rel="noopener">💬 واتساب</a><a class="athar-mail" href="mailto:atharlmssa@gmail.com">✉️ البريد الإلكتروني</a>';
      doc.body.appendChild(floating);
    }

    const contactSection=doc.querySelector('#contact');
    if(contactSection && !contactSection.querySelector('.athar-contact-box')){
      const box=doc.createElement('div');
      box.className='athar-contact-box';
      box.innerHTML='<a class="athar-wa" href="https://wa.me/966551902949" target="_blank" rel="noopener">تواصل عبر واتساب</a><a class="athar-mail" href="mailto:atharlmssa@gmail.com">تواصل عبر البريد الإلكتروني</a>';
      const target=contactSection.querySelector('.section-head')||contactSection;
      target.appendChild(box);
    }
  }catch(e){console.warn('Store enhancements skipped',e)}
}
frame.addEventListener('load',()=>{applyStoreFixes();setTimeout(applyStoreFixes,250);setTimeout(applyStoreFixes,1000)});
</script>
</body>
</html>
