<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أثر ولمسة | للطباعة والتصميم والهدايا</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#090908;width:100%;height:100%;font-family:Arial,sans-serif}.athar-banner{width:100%;background:#090908;line-height:0}.athar-banner img{display:block;width:100%;height:auto;max-height:720px;object-fit:cover;object-position:center}.store{display:block;width:100%;height:calc(100vh - min(50vw,720px));min-height:900px;border:0;background:#f7f3e9}@media(max-width:700px){.athar-banner img{min-height:240px;object-fit:cover;object-position:center}.store{height:1400px;min-height:1400px}}
</style>
</head>
<body>
<div class="athar-banner"><img src="athar-header.jpg" alt="أثر ولمسة - كل منتج يحمل أثراً ويترك لمسة"></div>
<iframe id="storeFrame" class="store" src="index-single-file.html?v=20260913-7" title="متجر أثر ولمسة"></iframe>
<script>
const frame=document.getElementById('storeFrame');
const WA='966551902949';
function svgData(type,bg,fg,accent,line1,line2=''){
 const common=`<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700"><rect width="700" height="700" fill="#f3f1eb"/><defs><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".14"/></filter></defs>`;
 const text=`<g text-anchor="middle" font-family="Arial, sans-serif" font-weight="700"><text x="350" y="355" fill="${fg}" font-size="44">${line1}</text>${line2?`<text x="350" y="410" fill="${accent}" font-size="30">${line2}</text>`:''}</g>`;
 let shape='';
 if(type==='shirt')shape=`<g filter="url(#s)"><path d="M210 168l85-42h110l85 42 82 72-70 80-58-48v285H256V272l-58 48-70-80z" fill="${bg}"/><path d="M302 127c8 42 88 42 96 0" fill="none" stroke="#bbb" stroke-width="8"/></g>${text}`;
 if(type==='mug')shape=`<g filter="url(#s)"><rect x="185" y="180" rx="26" width="285" height="345" fill="${bg}"/><path d="M470 250c95-10 105 185 0 190" fill="none" stroke="${bg}" stroke-width="42"/></g>${text}`;
 if(type==='case')shape=`<g filter="url(#s)"><rect x="225" y="115" rx="54" width="250" height="470" fill="${bg}"/><circle cx="285" cy="175" r="27" fill="#222"/><circle cx="355" cy="175" r="27" fill="#222"/><circle cx="285" cy="245" r="27" fill="#222"/></g>${text}`;
 return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(common+shape+'</svg>');
}
function waLink(name){return `https://wa.me/${WA}?text=${encodeURIComponent('مرحباً أثر ولمسة، أرغب في طلب تصميم: '+name)}`}
function newCard(p){
 const img=svgData(p.type,p.bg,p.fg,p.accent,p.line1,p.line2||'');
 return `<article class="product-card athar-new-card" data-cat="${p.cat}"><div class="product-img"><img src="${img}" alt="${p.name}"></div><h3>${p.name}</h3><p>${p.cat} • تصميم جديد</p><div class="price">${p.price}</div><a class="athar-order" href="${waLink(p.name)}" target="_blank" rel="noopener">اطلب عبر واتساب 💬</a></article>`;
}
function addNewProducts(doc){
 if(doc.getElementById('athar-new-products-added'))return;
 const marker=doc.createElement('div'); marker.id='athar-new-products-added'; marker.style.display='none'; doc.body.appendChild(marker);
 const shirts=[
  {name:'مستمر',cat:'عبارات تحفيزية',price:'89 ر.س',type:'shirt',bg:'#111',fg:'#fff',accent:'#d6a91e',line1:'مستمر',line2:'لأن لدي هدف'},
  {name:'نسخة أفضل',cat:'عبارات تحفيزية',price:'89 ر.س',type:'shirt',bg:'#fff',fg:'#111',accent:'#b48613',line1:'نسخة أفضل',line2:'من نفسي كل يوم'},
  {name:'قوة وإنجاز',cat:'عبارات تحفيزية',price:'89 ر.س',type:'shirt',bg:'#f5f5f3',fg:'#111',accent:'#c49218',line1:'قوة • صبر • تركيز',line2:'إنجاز'},
  {name:'الطريق يستحق',cat:'عبارات تحفيزية',price:'89 ر.س',type:'shirt',bg:'#111',fg:'#fff',accent:'#d6a91e',line1:'الطريق يستحق',line2:'استمر'},
  {name:'روح السعودية',cat:'تصاميم سعودية',price:'89 ر.س',type:'shirt',bg:'#111',fg:'#fff',accent:'#d6a91e',line1:'روح السعودية',line2:'SAUDI'}
 ];
 const mugs=[
  {name:'كل يوم فرصة',cat:'أكواب تحفيزية',price:'السعر عند الطلب',type:'mug',bg:'#fff',fg:'#111',accent:'#b48613',line1:'كل يوم',line2:'فرصة جديدة'},
  {name:'عقل أهدأ',cat:'أكواب تحفيزية',price:'السعر عند الطلب',type:'mug',bg:'#111',fg:'#fff',accent:'#d6a91e',line1:'عقل أهدأ',line2:'حياة أجمل'}
 ];
 const cases=[
  {name:'خطوة أقرب',cat:'كفرات جوال',price:'السعر عند الطلب',type:'case',bg:'#e9dfca',fg:'#111',accent:'#a8790d',line1:'خطوة أقرب',line2:'إلى حلمك'},
  {name:'سعودي وأفتخر',cat:'كفرات جوال',price:'السعر عند الطلب',type:'case',bg:'#111',fg:'#fff',accent:'#d6a91e',line1:'سعودي وأفتخر',line2:'🇸🇦'},
  {name:'الأشياء الجيدة',cat:'كفرات جوال',price:'السعر عند الطلب',type:'case',bg:'#cbd3d4',fg:'#111',accent:'#765a18',line1:'الأشياء الجيدة',line2:'تحتاج وقتًا'}
 ];
 const shirtGrid=doc.querySelector('#products .grid')||doc.querySelector('#products');
 const mugGrid=doc.querySelector('#mugs .grid')||doc.querySelector('#mugs');
 const otherGrid=doc.querySelector('#other-products .grid')||doc.querySelector('#other-products');
 if(shirtGrid) shirtGrid.insertAdjacentHTML('afterbegin',shirts.map(newCard).join(''));
 if(mugGrid) mugGrid.insertAdjacentHTML('afterbegin',mugs.map(newCard).join(''));
 if(otherGrid) otherGrid.insertAdjacentHTML('afterbegin',cases.map(newCard).join(''));
}
function applyStoreFixes(){
 try{
  const doc=frame.contentDocument||frame.contentWindow.document;if(!doc||!doc.head||!doc.body)return;
  let style=doc.getElementById('athar-store-fix');if(!style){style=doc.createElement('style');style.id='athar-store-fix';doc.head.appendChild(style)}
  style.textContent=`
  .product-img,.pic{display:flex!important;align-items:center!important;justify-content:center!important;overflow:hidden!important;background:#f4f2ec!important;position:relative!important}
  .product-img img,.pic img{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important;margin:0!important}
  .athar-new-card{border:1px solid #e5dccd!important;border-radius:16px!important;box-shadow:0 10px 26px rgba(0,0,0,.08)!important;overflow:hidden!important}
  .athar-new-card .product-img{padding:10px!important;background:#f5f2eb!important}
  .athar-new-card .product-img img{transform:none!important;object-fit:contain!important;border-radius:10px!important;filter:none!important}
  .athar-new-card:hover .product-img img{transform:scale(1.02)!important}
  .athar-new-card h3{font-weight:900!important}.athar-new-card .price{font-weight:900!important;color:#8b6811!important}
  .athar-order{display:block!important;width:100%!important;background:#151311!important;color:#fff!important;text-align:center!important;padding:12px!important;border-radius:8px!important;font-weight:900!important;text-decoration:none!important;margin-top:8px!important}
  .athar-order:hover{background:#d6a91e!important;color:#111!important}
  .athar-contact-strip{position:sticky!important;top:0!important;z-index:9999!important;background:#0d0c0b!important;color:#fff!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:22px!important;flex-wrap:wrap!important;padding:10px 14px!important;border-bottom:1px solid #3d321d!important}
  .athar-contact-strip a{color:#fff!important;text-decoration:none!important;font-weight:800!important}.athar-contact-strip a:hover{color:#d6a91e!important}
  .athar-contact-floating{position:fixed!important;right:18px!important;bottom:18px!important;z-index:99999!important;display:flex!important;flex-direction:column!important;gap:10px!important}.athar-contact-floating a{display:flex!important;align-items:center!important;justify-content:center!important;padding:12px 16px!important;border-radius:28px!important;text-decoration:none!important;font-weight:900!important;box-shadow:0 8px 24px rgba(0,0,0,.22)!important}.athar-wa{background:#25D366!important;color:#fff!important}.athar-mail{background:#d6a91e!important;color:#111!important}
  @media(max-width:700px){.athar-contact-strip{gap:10px!important;font-size:11px!important}.athar-contact-floating{right:10px!important;bottom:10px!important}.athar-contact-floating a{padding:10px 12px!important;font-size:12px!important}}
  `;
  addNewProducts(doc);
  let strip=doc.querySelector('.athar-contact-strip');if(!strip){strip=doc.createElement('div');strip.className='athar-contact-strip';strip.innerHTML='<a href="https://wa.me/966551902949" target="_blank">📱 واتساب: 055 190 2949</a><a href="mailto:atharlmssa@gmail.com">✉️ atharlmssa@gmail.com</a>';doc.body.insertBefore(strip,doc.body.firstChild)}
  let floating=doc.querySelector('.athar-contact-floating');if(!floating){floating=doc.createElement('div');floating.className='athar-contact-floating';floating.innerHTML='<a class="athar-wa" href="https://wa.me/966551902949" target="_blank">💬 واتساب</a><a class="athar-mail" href="mailto:atharlmssa@gmail.com">✉️ البريد الإلكتروني</a>';doc.body.appendChild(floating)}
 }catch(e){console.warn(e)}
}
frame.addEventListener('load',()=>{applyStoreFixes();setTimeout(applyStoreFixes,300);setTimeout(applyStoreFixes,1000)});
</script>
</body>
</html>
